profile_version: cabinet_generic_host_profile.v0
status: candidate
profile_id: local_postgres_filesystem_candidate.v0

purpose: >-
  Candidate first lowering profile for compiling the Cabinet archive/source box
  into generic host relations. Provider verification is evidence-driven per
  provider; the complete host is verified only when every required provider has
  executed PASS evidence.

providers:
  authority_kernel:
    satisfies:
      - principal_authentication
      - bounded_capability_grants
      - exact_resource_scope_authorization
      - effect_policy_enforcement
      - disclosure_policy_enforcement
    runtime_dependencies: []
    verification:
      required: true
      status: PASS
      evidence:
        - experiments/cabinet-vault/AUTHORITY_KERNEL_RUNTIME_EVIDENCE.md

  typed_schema_kernel:
    satisfies:
      - typed_input_output_validation
    runtime_dependencies:
      - pydantic
    verification:
      required: true
      status: PASS
      evidence:
        - experiments/cabinet-vault/TYPED_SCHEMA_KERNEL_RUNTIME_EVIDENCE.md

  postgres_record_kernel:
    satisfies:
      - transactional_record_store
      - resource_locking
      - audit_and_provenance
    runtime_dependencies:
      - psycopg
    verification:
      required: true
      status: PASS
      evidence:
        - experiments/cabinet-vault/POSTGRES_RECORD_KERNEL_RUNTIME_EVIDENCE.md

  local_private_byte_vault:
    satisfies:
      - opaque_source_byte_vault
      - staged_byte_verification_and_atomic_publication
      - committed_effect_recovery
    runtime_dependencies: []
    verification:
      required: true
      status: PASS
      evidence:
        - experiments/cabinet-vault/LOCAL_PRIVATE_BYTE_VAULT_RUNTIME_EVIDENCE.md

  protected_configuration_kernel:
    satisfies:
      - protected_configuration
    runtime_dependencies: []
    verification:
      required: true
      status: PASS
      evidence:
        - experiments/cabinet-vault/PROTECTED_CONFIGURATION_KERNEL_RUNTIME_EVIDENCE.md

runtime_projection:
  dependencies:
    - pydantic
    - psycopg

product_specific_dependencies: []
