manifest_version: box_contract.v0
status: exploratory

cabinet:
  id: cabinet.local.registry_context
  product: Cabinet
  slice: registry_project_observation
  locality: local
  trust_boundary: local_cabinet_host
  description: >-
    Cabinet-owned contract for accepting project observations. Cabinet describes
    only the meanings and authority it needs; it does not name a Registry API,
    endpoint, DTO, client, or adapter.

source_baseline:
  case: examples/cabinet-backend
  evidence:
    - examples/cabinet-backend/60_model_closure_core.json
    - examples/cabinet-backend/60_model_closure_support.json

external_dependencies: []

host_owned_fields:
  fields:
    - snapshot_id
    - captured_at
    - source_contract_version

schemas:
  RegistryProjectObservation:
    identity: value
    fields:
      project_id:
        type: str
        semantic: project.identity
        authority: project.catalogue.authority
        mapping: exact
      display_name:
        type: str
        semantic: project.display_name
        authority: project.catalogue.authority
        mapping: exact
      address:
        type: str
        semantic: project.address
        authority: project.catalogue.authority
        mapping: exact
      status:
        type: str
        semantic: project.catalogue.status
        authority: project.catalogue.authority
        mapping: exact
      registry_updated_at:
        type: datetime
        semantic: project.catalogue.updated_at
        authority: project.catalogue.authority
        mapping: exact

  RegistryProjectSnapshot:
    identity: entity
    fields:
      snapshot_id: str
      project_id: str
      display_name: str
      address: str
      status: str
      registry_updated_at: datetime
      captured_at: datetime
      source_contract_version: str

capabilities:
  registry.project_observation.accept:
    input: RegistryProjectObservation
    output: RegistryProjectSnapshot
    effects:
      - registry_context_write
    requires:
      - authenticated_principal
      - grant:registry.project_observation.accept
    host_binding:
      snapshot_id: host_minted_snapshot_id
      captured_at: host_clock
      source_contract_version: observed_source_manifest_version
    invariants:
      - input_values_are_preserved_exactly
      - archived_status_does_not_mean_completed
      - missing_from_one_observation_does_not_mean_deleted
      - project_catalogue_authority_is_preserved_as_provenance

experiment_boundaries:
  permanent_registry_client_in_cabinet: false
  permanent_registry_adapter_in_cabinet: false
  field_name_inference_allowed: false
  type_only_mapping_allowed: false
