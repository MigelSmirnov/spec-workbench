manifest_version: box_contract.v0
status: exploratory

box:
  id: presupro.pricing.contract
  product: PresuPro
  slice: pricing_semantics
  description: >-
    Factual pricing self-description distilled from the 2026-08-20 local
    PresuPro reconnaissance. It exposes only semantics demonstrated by the
    accepted pricing implementation and test evidence. It deliberately does not
    invent a canonical per-item total.

reconnaissance:
  observed_at: 2026-08-20
  source_workspace: projects/PresuPro_sandbox
  test_evidence:
    command: >-
      python -m pytest -q experiments/cabinet-vault/tests/test_pricing_totals.py::test_synthetic_estimate_pins_backend_monetary_tax_basis
    result: 1_passed
  facts:
    currency:
      source_kind: application_contract_constant
      value: EUR
      contract: config.app.currency
    pricing_order:
      - effective_unit_price
      - effective_quantity_after_waste
      - base_line
      - discount
      - margin
      - iva
    aggregate_total:
      formula: taxable_subtotal_plus_iva_total
      monetary_basis: gross_tax_inclusive
    canonical_item_total:
      declared: false
      reason: >-
        Backend aggregate calculation, export Line Total, frontend line total,
        and Holded projection do not expose one identical authoritative line
        value.

schemas:
  EmptyInput:
    identity: value
    fields: {}

  PresuProPricingObservation:
    identity: value
    fields:
      currency:
        type: str
        semantic: money.currency
        authority: estimate.source.authority
        source:
          kind: contract_constant
          contract: config.app.currency
          value: EUR
      taxable_subtotal:
        type: Decimal
        semantic: estimate.aggregate.taxable_subtotal
        authority: estimate.source.authority
        monetary_basis: tax_exclusive_after_discount_and_margin
      iva_total:
        type: Decimal
        semantic: estimate.aggregate.tax_amount
        authority: estimate.source.authority
      grand_total:
        type: Decimal
        semantic: estimate.aggregate.grand_total
        authority: estimate.source.authority
        monetary_basis: gross_tax_inclusive

capabilities:
  estimate.pricing.observe:
    input: EmptyInput
    output: PresuProPricingObservation
    effects: []

experiment_boundaries:
  canonical_item_total_declared: false
  aggregate_total_may_stand_in_for_item_total: false
  monetary_basis_may_be_inferred_from_decimal_type: false
