findings:
  - id: CW-SOURCE-ID-001
    class: UPSTREAM_CONTRACT_ALIGNED
    severity: PASS
    statement: >-
      invoice-f260001 and source-f260001 are separate stable identities owned by the
      dedicated confirmed Invoice Card.

  - id: CW-SYNC-001
    class: INTEGRATION_RUNTIME_VERIFIED
    severity: PASS
    statement: >-
      Exact confirmed Card revisions are accepted immutably with bounded receipt,
      explicit reconciliation and preserved Web authority.

  - id: CW-MEDIA-001
    class: PARSER_BACKED_LOWERING_VERIFIED
    severity: PASS
    statement: >-
      Source media is parser-derived and the real F260001 source was identified as
      application/pdf without rewriting the Web Card.

  - id: CW-HASH-001
    class: NO_EXPECTED_HASH_RUNTIME_VERIFIED
    severity: PASS
    statement: >-
      The local PDF SHA-256 remains local custody evidence and is not fabricated as
      an upstream Web expectation.

  - id: CW-REAL-DATA-001
    class: REAL_USER_DATA_FUNCTIONAL_EXECUTION_VERIFIED
    severity: PASS
    statement: >-
      The exact real F260001 Card was accepted and its real PDF attached while the
      confirmed Web Card remained unchanged and durable effect audit rows existed.

  - id: CW-AUTH-GRANT-001
    class: EXACT_GRANT_CONFIGURATION_AND_CI_ENFORCEMENT
    severity: PASS
    evidence_class: PINNED_CODE_PLUS_CI_PROBE
    statement: >-
      The bridge configures non-empty exact grants for invoice:invoice-f260001 and
      CI negative probes prove wrong credential class and wrong invoice scope are
      denied. The successful private real run itself contains no negative grant test.

  - id: CW-PREAUTH-001
    class: LOCAL_BOX_STATE_AUTHORIZED_BUT_SOURCE_BYTES_PREPARSED
    severity: PARTIAL
    statement: >-
      Effectful local-box state access occurs inside AuthorityKernel-authorized
      operations, but the real runner reads PDF bytes and the source adapter performs
      parser identification before AuthorityKernel.invoke(). Therefore a stronger
      authorization-before-any-source-byte-access property is not satisfied.

  - id: CW-TRANSPORT-001
    class: DECLARED_TRANSPORT_NOT_EXERCISED_BY_REAL_RUN
    severity: BLOCK_FOR_ASSURANCE
    statement: >-
      The bridge declares local_cli_stdio, but the real canary imported the bridge
      and invoked methods in-process. The runner also used private bridge fields for
      read-only verification, so process/public-surface confinement was not proven.

  - id: CW-AUDIT-ASSURANCE-001
    class: REAL_RUN_AUDIT_ATTESTATION_INCOMPLETE
    severity: PARTIAL
    statement: >-
      Durable acceptance and attachment audit existence is proven. The public real
      evidence retained only booleans and did not preserve bounded event ids/digests
      plus exact principal/capability/interaction/effects fields or exact-run
      AuthorityKernel decision evidence.

  - id: CW-INVOICEREFSET-001
    class: NOT_APPLICABLE_TO_F260001_REAL_PATH
    severity: INFO
    statement: >-
      InvoiceRefSet belongs to the separate CabinetGraphHost path and was not used by
      the F260001 bridge. Its opacity is covered by separate graph tests, not by this
      real-data execution.

