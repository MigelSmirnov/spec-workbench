findings:
  - id: CW-SOURCE-ID-001
    class: UPSTREAM_CONTRACT_ALIGNED
    severity: PASS
    owner: Cabinet_web/card-contracts
    statement: >-
      Cabinet_web main defines source.source_id as stable identity within the owning
      Invoice Card. Invoice Card V1 requires it, invoice-source payment evidence
      references it, draft preparation assigns or preserves it, and source metadata
      updates cannot replace it.
    accepted_evidence:
      - Cabinet_web PR 16 merged as d4419e3b948d49bd85a99a0941a350a73494cd27
      - domain and storage documents state stable source identity independent of byte availability
      - executable schema requires source_id
      - deterministic validator binds invoice_source evidence.source_ref to source_id
      - draft and evidence services preserve identity and reject contradictory replacement
    forbidden_regression:
      - generate_source_id_inside_backend_adapter
      - infer_source_identity_from_filename
      - replace_source_identity_when_storage_metadata_changes

  - id: CW-SYNC-001
    class: INTEGRATION_RUNTIME_VERIFIED
    severity: PASS
    owner: Cabinet_web_to_local_box_integration
    statement: >-
      The transport-independent v1 synchronization contract is executable as
      invoice.archive.accept_revision. Runtime evidence proves canonical Card-hash
      verification, reviewed Cabinet_web validation, delivery idempotency,
      base-revision reconciliation, immutable revision retention, bounded receipts
      and compatibility with the same invoice state later used by source attachment.
    contract:
      machine: experiments/cabinet-vault/cabinet_web_sync_contract_v1.yaml
      human: experiments/cabinet-vault/CABINET_WEB_SYNC_V1.md
      box_extension: experiments/cabinet-vault/cabinet_web_sync_box_extension_v1.yaml
    runtime_evidence: experiments/cabinet-vault/CABINET_WEB_SYNC_RUNTIME_EVIDENCE.md
    preserved_rules:
      - Cabinet_web_remains_authority_for_confirmed_Card_facts
      - backend_accepts_exact_revision_without_rewriting_it
      - same_delivery_same_revision_is_idempotent
      - same_delivery_different_revision_is_conflict
      - stale_base_requires_reconciliation_without_overwrite
      - accepted_new_revision_never_deletes_previous_immutable_revision
      - Card_acceptance_does_not_claim_source_bytes_are_attached
      - classical_InvoiceTransferManifest_ingest_remains_deferred

  - id: CW-MEDIA-001
    class: PARSER_BACKED_LOWERING_VERIFIED
    severity: PASS
    owner: Cabinet_web_to_local_box_integration
    statement: >-
      Exact source-byte media identity is derived only from bounded parser evidence.
      Cabinet_web source.kind, filename, extension and caller MIME do not choose the
      parser. Runtime evidence proves the no-predeclared-MIME path while leaving the
      confirmed Card unchanged.
    contract: experiments/cabinet-vault/cabinet_web_source_media_lowering_v1.yaml
    runtime_evidence: experiments/cabinet-vault/CABINET_WEB_ATTACH_CANARY_RUNTIME_EVIDENCE.md
    forbidden_regression:
      - map_photo_to_JPEG_unconditionally
      - trust_filename_extension
      - trust_caller_MIME_without_parser_validation
      - write_detected_media_type_into_confirmed_Card

  - id: CW-HASH-001
    class: NO_EXPECTED_HASH_RUNTIME_VERIFIED
    severity: PASS
    owner: Cabinet_web_to_local_box_integration
    statement: >-
      Cabinet_web Invoice Card V1 may omit an expected binary SHA-256. Runtime
      evidence proves that the local box calculates the source-byte SHA-256, stores
      it as local custody evidence, preserves null durable upstream hash expectation,
      preserves the confirmed Card document/content hash, handles idempotent replay,
      rejects conflicting bytes and recovers after interrupted publication.
    runtime_evidence: experiments/cabinet-vault/CABINET_WEB_ATTACH_CANARY_RUNTIME_EVIDENCE.md
    forbidden_regression:
      - write_calculated_hash_into_confirmed_Card
      - convert_local_hash_into_fabricated_upstream_expectation
      - allow_conflicting_bytes_to_replace_source_identity

  - id: CW-LIFECYCLE-001
    class: ALIGNED_SPLIT
    severity: PASS
    owner: shared_boundary
    statement: >-
      Cabinet_web invoice_attach_source is a draft Card metadata mutation. The local
      box invoice.source.attach is a durable local byte attachment for an accepted
      confirmed Card revision. Synchronization connects them without collapsing the
      lifecycle operations.

  - id: CW-AUTHORITY-001
    class: ALIGNED
    severity: PASS
    owner: shared_boundary
    statement: >-
      Cabinet_web/GitHub remains authority for Invoice Card facts and revision
      history, while the local box owns archive authority, source bytes, effects,
      recovery and audit. The backend preserves exact confirmed Card revisions and
      does not import its database model into Cabinet_web.

