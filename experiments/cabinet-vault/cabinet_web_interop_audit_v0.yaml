findings:
  - id: CW-SOURCE-ID-001
    class: UPSTREAM_CONTRACT_ALIGNED
    severity: PASS
    owner: Cabinet_web/card-contracts
    statement: >-
      Cabinet_web defines source.source_id as stable identity within the owning
      Invoice Card. The real normalized F260001 Card uses invoice-f260001 separately
      from source-f260001.
    forbidden_regression:
      - generate_source_id_inside_backend_adapter
      - infer_source_identity_from_filename
      - replace_source_identity_when_storage_metadata_changes

  - id: CW-SYNC-001
    class: INTEGRATION_RUNTIME_VERIFIED
    severity: PASS
    owner: Cabinet_web_to_local_box_integration
    statement: >-
      cabinet-web-sync-v1 is executable through invoice.archive.accept_revision and
      the real F260001 revision was accepted with the exact canonical Web hash.
    preserved_rules:
      - Cabinet_web_remains_authority_for_confirmed_Card_facts
      - backend_accepts_exact_revision_without_rewriting_it
      - same_delivery_same_revision_is_idempotent
      - same_delivery_different_revision_is_conflict
      - stale_base_requires_reconciliation_without_overwrite
      - accepted_new_revision_never_deletes_previous_immutable_revision
      - Card_acceptance_does_not_claim_source_bytes_are_attached
      - classical_InvoiceTransferManifest_ingest_remains_deferred

  - id: CW-MEDIA-001
    class: PARSER_BACKED_LOWERING_VERIFIED
    severity: PASS
    owner: Cabinet_web_to_local_box_integration
    statement: >-
      Exact source media identity is parser-derived. The real F260001 PDF was
      validated as application/pdf without making caller MIME or filename authority.

  - id: CW-HASH-001
    class: NO_EXPECTED_HASH_RUNTIME_VERIFIED
    severity: PASS
    owner: Cabinet_web_to_local_box_integration
    statement: >-
      The local box calculated the real F260001 PDF SHA-256 as local custody evidence
      while the confirmed Web Card remained unchanged and did not acquire a fabricated
      upstream binary hash.

  - id: CW-LIFECYCLE-001
    class: ALIGNED_SPLIT
    severity: PASS
    owner: shared_boundary
    statement: >-
      Card revision acceptance and local source-byte attachment remained separate
      operations during the real canary.

  - id: CW-AUTHORITY-001
    class: ALIGNED
    severity: PASS
    owner: shared_boundary
    statement: >-
      The trusted bridge preserved synchronization vs local-agent credential classes,
      exact invoice scope, host-owned grants and protected configuration while the
      two autonomous applications retained their respective authority.

  - id: CW-REAL-DATA-001
    class: REAL_USER_DATA_INTEROP_VERIFIED
    severity: PASS
    owner: shared_boundary
    statement: >-
      The first real Cabinet_web user-data canary completed: exact confirmed F260001
      revision accepted, real PDF attached to source-f260001, parser/hash evidence
      recorded locally, Card unchanged, and acceptance/attachment audit present.

