    - preserve_confirmed_Card_bytes_and_hash
    - attach_bytes_through_verified_Cabinet_web_source_adapter
    - record_backend_receipt_and_local_source_evidence

forbidden_substitutes:
  - tests_fixture_as_real_user_data
  - synthetic_Card_as_real_user_data
  - unconfirmed_draft_as_canary_target
  - source_bytes_without_exact_Card_source_identity
  - branch_only_invoice_not_accepted_into_Cabinet_web_main

next_transition: >-
  When one real confirmed Invoice Card and its source bytes are accepted and
  addressable in the Cabinet_web workflow, refresh this inventory against the exact
  main commit, pin the Card revision and source identity, then execute one real-data
  canary. Do not redesign the interop contract merely because the current data set
  has no eligible invoice.
