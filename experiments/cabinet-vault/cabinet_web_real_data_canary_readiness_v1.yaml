    - status_confirmed
    - source_source_id_present
    - exact_canonical_content_hash_computable
    - source_git_commit_sha_known
  source_bytes:
    - correspond_to_exact_source_id
    - available_without_inventing_storage_claim
    - byte_content_accessible_to_local_canary_transport
  execution:
