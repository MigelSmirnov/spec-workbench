blocking_condition:
  id: CW-LOCAL-CONNECTION-001
  class: AUTHORIZED_CAPABILITY_TRANSPORT_UNAVAILABLE
  statement: >-
    The real Cabinet_web Card and PDF are ready and the protected executors are
    runtime-verified, but the local agent currently has no authorized connection
    to a running trusted local-box host that exposes invoice.archive.accept_revision
    and invoice.source.attach with their required authority boundaries and exact
    invoice scope.
  owner: local_box_host_wiring
  severity: BLOCK

required_connection_repair:
  transport:
    - provide_minimal_local_tool_or_IPC_bridge_to_existing_executors
    - do_not_reimplement_business_semantics_in_transport
    - do_not_use_demo_SQLite_cabinet_host_or_graph_host
  authority:
    - preserve_SYNCHRONIZATION_BOUNDARY_for_invoice.archive.accept_revision
    - preserve_LOCAL_AGENT_BOUNDARY_for_invoice.source.attach
    - provision_host_owned_principals_credentials_and_exact_capability_grants
    - grant_resource_scope_exactly_invoice:invoice-f260001_for_the_canary
    - keep_credential_material_out_of_requests_receipts_logs_and_repo
  providers:
    - use_verified_PostgresRecordKernel
    - use_verified_LocalPrivateByteVault
    - use_verified_TypedSchemaKernel
    - use_verified_bounded_content_validation_and_media_identification
    - use_ProtectedConfigurationKernel_or_equivalent_host_owned_secret_resolution
  lifecycle:
    - run_required_publication_recovery_before_host_reports_ready
    - return_only_bounded_safe_results
    - preserve_append_only_audit

base_revision_rule: >-
  A separate direct database preflight read is not required. For the first
  authorized delivery, base_backend_content_hash may be null. If a current backend
  revision already exists and differs, the verified acceptance runtime must return
  reconciliation_required with backend_current_content_hash and perform no overwrite.

forbidden_shortcuts:
  - call_executor_without_AuthorityKernel
  - mint_grant_from_agent_request
  - accept_caller_asserted_principal_or_authorization
  - expose_PostgreSQL_DSN_or_vault_root_to_agent_output
  - direct_PostgreSQL_write_as_sync_transport
  - direct_vault_write_as_source_attachment
  - use_demo_SQLite_host_for_real_invoice
  - weaken_exact_invoice_scope_for_convenience

success_transition: >-
  Return to the F260001 real-data canary only after the local agent can invoke the
  two existing protected capabilities through a trusted local host/bridge with
  valid credentials and exact invoice scope. The real user-data canary remains
  unexecuted until revision acceptance and real-PDF attachment both complete and
  their safe audit evidence is verified.