blocking_condition:
  id: REAL-CANARY-DATA-001
  class: MISSING_REAL_INPUT
  statement: >-
    Cabinet_web main currently contains no Invoice Card directory under data/cards,
    so there is no exact confirmed Invoice Card revision to bind to real source bytes.
    The runtime contract is ready, but a real user-data canary cannot be executed
    honestly from the current repository state.
