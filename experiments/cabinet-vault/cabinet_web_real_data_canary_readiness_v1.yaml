previous_local_preflight:
  result: PASS_FAIL_CLOSED_DIRECTORY_INVENTORY_ONLY
  interpretation: >-
    The preflight correctly refused backend effects because no dedicated Invoice Card
    existed, but its conclusion that no real invoice candidate existed was a false
    negative caused by scanning only data/cards/invoice-*/card.json.
  backend_invocation_performed: false
  postgres_effect_performed: false
  source_attachment_performed: false

blocking_condition:
  id: CW-INVOICE-OWNERSHIP-001
  class: EMBEDDED_INVOICE_NOT_NORMALIZED_TO_INVOICE_CARD
  statement: >-
    A real invoice candidate exists in Cabinet_web main, but canonical invoice facts
    are embedded in Client and Project Cards and the document/source identity is
    currently conflated as invoice-f260001. The accepted Invoice Card V1 contract is
    therefore not yet the owner of this invoice's canonical facts.
  owner: Cabinet_web/card-data-ownership
  severity: BLOCK

required_repair:
  - create_data/cards/invoice-f260001/card.json_through_Cabinet_web_invoice_workflow
  - separate_invoice_id_from_source_source_id
  - preserve_only_truthful_existing_invoice_facts
  - use_real_source_PDF_for_missing_invoice_details_when_available
  - validate_with_current_Invoice_Card_V1_validator
  - confirm_and_commit_exact_Card_revision
  - reduce_Client_Project_invoice_fields_to_relationship_or_derived_projection_only

forbidden_repairs:
  - backend_adapter_builds_Invoice_Card_from_Project_financials
  - treat_invoice-f260001_as_permanent_source_id
  - invent_missing_invoice_line_semantics_to_satisfy_schema
  - send_Client_or_Project_Card_to_invoice.archive.accept_revision
  - call_embedded_projection_a_confirmed_Invoice_Card

canary_transition: >-
  After invoice-f260001 exists as a clean tracked confirmed Invoice Card V1 with a
  stable source.source_id and the corresponding original PDF bytes are available,
  build the exact delivery from Cabinet_web main and run the already verified
  invoice.archive.accept_revision -> receipt -> invoice.source.attach sequence.
