manifest_version: box_contract.v0
status: exploratory

box:
  id: registry.project.catalogue
  product: Registry
  slice: project_observation_source
  description: >-
    Minimal self-description of the Registry project facts needed by the
    derivability probe. It deliberately names meanings and authority, not
    Cabinet field names or a Cabinet-specific adapter.

schemas:
  EmptyInput:
    identity: value
    fields: {}

  RegistryProject:
    identity: entity
    fields:
      id:
        type: str
        semantic: project.identity
        authority: project.catalogue.authority
      name:
        type: str
        semantic: project.display_name
        authority: project.catalogue.authority
      address:
        type: str
        semantic: project.address
        authority: project.catalogue.authority
      status:
        type: str
        semantic: project.catalogue.status
        authority: project.catalogue.authority
      updated_at:
        type: datetime
        semantic: project.catalogue.updated_at
        authority: project.catalogue.authority

capabilities:
  project.observe:
    input: EmptyInput
    output: RegistryProject
    effects: []
