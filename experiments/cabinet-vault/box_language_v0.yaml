language_version: cabinet_box_language.v0
status: exploratory

principles:
  - id: BXL-CORE-001
    statement: compiler_implements_declared_language_and_must_not_extend_it_silently
  - id: BXL-CORE-002
    statement: deterministic_behavior_is_not_specification_evidence_unless_the_rule_is_machine_addressable
  - id: BXL-CORE-003
    statement: failed_deterministic_preconditions_fail_closed_instead_of_falling_back_to_model_or_generated_code

gap_kinds:
  choice_gap: compiler_cannot_determine_one_answer_from_declared_semantics
  evidence_gap: answer_may_be_human_readable_but_is_not_machine_provable_from_declared_semantics
  hidden_rule_gap: compiler_behavior_depends_on_an_architectural_rule_not_declared_by_this_language

rules:
  BXL-DERIVE-001:
    statement: capability_input_and_output_must_reference_named_declared_schemas
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_named_schema_contract_is_required
  BXL-DERIVE-002:
    statement: every_required_target_field_must_declare_type_and_semantic_identity
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_target_field_requires_machine_addressable_meaning
  BXL-DERIVE-003:
    statement: field_names_are_not_mapping_evidence
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_field_name_is_not_semantic_evidence
  BXL-DERIVE-004:
    statement: exact_projection_candidates_require_equal_semantic_identity
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_semantic_identity_must_match_exactly
  BXL-DERIVE-005:
    statement: v0_exact_projection_requires_equal_declared_types
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_exact_projection_requires_equal_type
  BXL-DERIVE-006:
    statement: when_target_requires_authority_source_must_declare_the_same_authority
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_required_authority_must_match
  BXL-DERIVE-007:
    statement: exactly_one_source_field_must_satisfy_the_target_semantic_contract
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_semantic_source_must_be_unambiguous
  BXL-DERIVE-008:
    statement: v0_compiles_only_declared_exact_projection_and_rejects_other_transformations
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_v0_rejects_undeclared_transformation
  BXL-DERIVE-009:
    statement: unresolved_derivation_is_not_executable
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_unresolved_derivation_cannot_execute
  BXL-DERIVE-010:
    statement: exact_projection_discloses_only_proven_target_fields
    tools: [box_derivability]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_projection_drops_unrequested_source_fields

  BXL-COMPOSE-001:
    statement: composition_compiler_accepts_capabilities_and_manifests_but_no_handwritten_field_mapping
    tools: [box_composition]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_composition_api_has_no_handwritten_mapping_argument
  BXL-COMPOSE-002:
    statement: derivability_preflight_completes_before_either_box_is_invoked
    tools: [box_composition]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_unresolved_composition_invokes_neither_box
  BXL-COMPOSE-003:
    statement: unresolved_composition_is_not_executable
    tools: [box_composition]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_unresolved_composition_is_non_executable
  BXL-COMPOSE-004:
    statement: successful_composition_executes_source_then_proven_projection_then_target
    tools: [box_composition]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_derived_composition_executes_declared_three_node_order
  BXL-COMPOSE-005:
    statement: unresolved_composition_has_no_model_generated_code_or_other_fallback
    tools: [box_composition]
    conformance_test: experiments/cabinet-vault/tests/test_box_language_conformance.py::test_unresolved_composition_has_no_fallback_path

tool_bindings:
  box_derivability:
    implementation: experiments/cabinet-vault/tools/box_derivability.py
    implementation_blob_sha: 4de8dcc9d81f110552d891032eddc74ba58df2aa
    declared_rules:
      - BXL-DERIVE-001
      - BXL-DERIVE-002
      - BXL-DERIVE-003
      - BXL-DERIVE-004
      - BXL-DERIVE-005
      - BXL-DERIVE-006
      - BXL-DERIVE-007
      - BXL-DERIVE-008
      - BXL-DERIVE-009
      - BXL-DERIVE-010
  box_composition:
    implementation: experiments/cabinet-vault/tools/box_composition.py
    implementation_blob_sha: 24a5607398df1a8d5a23255cd0335fcd5a15c52b
    declared_rules:
      - BXL-COMPOSE-001
      - BXL-COMPOSE-002
      - BXL-COMPOSE-003
      - BXL-COMPOSE-004
      - BXL-COMPOSE-005

audit_policy:
  unknown_implementation_rule: block
  declared_rule_missing_from_implementation: block
  implementation_fingerprint_drift: block
  rule_without_conformance_test: block
  missing_conformance_test_function: block
  deterministic_fallback_not_declared_by_language: block
