findings:
  - id: interface-relation-missing
    summary: Generated lowering had an interface port with no machine-declared concrete implementation relation.
    finding_class: LANGUAGE_RELATION_GAP
    evidence:
      - NEXT_SESSION_HANDOFF.md records the missing interface-to-implementation relation from the failed generated backend.
    verification:
      required: true
      status: FAIL

  - id: psycopg-projection-lost
    summary: Local projection omitted a required PostgreSQL driver import needed by the selected lowering.
    finding_class: PROJECTION_GAP
    evidence:
      - NEXT_SESSION_HANDOFF.md records a lost psycopg dependency in local projection.
    verification:
      required: true
      status: FAIL

  - id: semantic-runtime-verification-skipped
    summary: Required semantic and runtime verification did not execute while the overall generation route still appeared complete.
    finding_class: VERIFICATION_NOT_EXECUTED
    evidence:
      - NEXT_SESSION_HANDOFF.md records skipped required semantic and runtime verification.
    verification:
      required: true
      status: SKIP

  - id: external-boundary-stub-concentration
    summary: Missing or stubbed methods clustered at Holded, Synchronization, VPS, and HTTP boundaries.
    finding_class: BOUNDARY_LEAK
    evidence:
      - NEXT_SESSION_HANDOFF.md records concentrated stubs at external integration and transport boundaries.
    verification:
      required: true
      status: FAIL

  - id: authority-construction-mismatch
    summary: Generated audit, principal, and credential construction did not satisfy the accepted authority model.
    finding_class: AUTHORITY_SEMANTIC_GAP
    evidence:
      - NEXT_SESSION_HANDOFF.md records authority-model mismatches in generated construction paths.
    verification:
      required: true
      status: FAIL

  - id: plan-actual-domain-unresolved
    summary: PlanActual generated methods remained unresolved where accepted domain meaning is required.
    finding_class: DOMAIN_SEMANTIC_GAP
    evidence:
      - NEXT_SESSION_HANDOFF.md records unresolved PlanActual domain methods and later semantic monetary gaps.
    verification:
      required: true
      status: UNVERIFIED

  - id: retention-release-domain-unresolved
    summary: RetentionRelease generated methods remained unresolved at a Cabinet-owned destructive-effect policy boundary.
    finding_class: DOMAIN_SEMANTIC_GAP
    evidence:
      - NEXT_SESSION_HANDOFF.md records unresolved RetentionRelease domain methods.
    verification:
      required: true
      status: UNVERIFIED
