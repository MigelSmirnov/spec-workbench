manifest_version: box_contract.v0
status: exploratory

box:
  id: cabinet.invoice_card_v1.line_monetary
  product: Cabinet
  slice: invoice_line_monetary_source
  description: >-
    Self-description of the monetary meanings proved by the real Invoice Card V1
    contract. It intentionally exposes both canonical line amounts instead of
    inventing a generic InvoiceLine.total that does not exist in V1.

source_evidence:
  repository: Cabinet_web
  verified_commit: 63f1752
  facts:
    canonical_card_is_source_truth: true
    line_total_field_exists: false
    net_amount:
      meaning: post_discount_tax_exclusive
      formula: ROUND_HALF_UP(quantity * unit_price_net - discount_amount, 2)
    gross_amount:
      meaning: tax_inclusive
      formula: ROUND_HALF_UP(net_amount + tax_amount, 2)
    currency_binding:
      source: root_invoice.currency
      line_currency_field_exists: false
    validator_rewrites_source_values: false
  local_probe:
    focused_result: 1_passed_in_0.18s
    validator_suite_result: 16_passed_22_subtests_in_0.18s
    git_diff_check: PASS

schemas:
  EmptyInput:
    identity: value
    fields: {}

  InvoiceCardV1LineMonetaryObservation:
    identity: value
    fields:
      net_amount:
        type: Decimal
        semantic: invoice.line.net_amount
        authority: invoice.card.authority
      net_amount_basis:
        type: str
        semantic: invoice.line.net_amount_basis
        authority: invoice.card.authority
        source:
          kind: contract_constant
          value: post_discount_tax_exclusive
      gross_amount:
        type: Decimal
        semantic: invoice.line.gross_amount
        authority: invoice.card.authority
      gross_amount_basis:
        type: str
        semantic: invoice.line.gross_amount_basis
        authority: invoice.card.authority
        source:
          kind: contract_constant
          value: tax_inclusive
      tax_amount:
        type: Decimal
        semantic: invoice.line.tax_amount
        authority: invoice.card.authority
      discount_amount:
        type: Decimal
        semantic: invoice.line.discount_amount
        authority: invoice.card.authority
      currency:
        type: str
        semantic: money.currency
        authority: invoice.card.authority
        source:
          kind: containing_document_field
          field: invoice.currency

capabilities:
  invoice_line.monetary.observe:
    input: EmptyInput
    output: InvoiceCardV1LineMonetaryObservation
    effects: []

experiment_boundaries:
  generic_line_total_declared: false
  net_may_stand_in_for_generic_actual_without_target_decision: false
  gross_may_stand_in_for_generic_actual_without_target_decision: false
  tax_rate_derives_tax_amount_without_contract_rule: false
  discount_percent_derives_discount_amount_without_contract_rule: false
