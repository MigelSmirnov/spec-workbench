manifest_version: box_contract.v0
status: exploratory

box:
  id: presupro.estimate.source
  product: PresuPro
  slice: accepted_estimate_observation_surface
  description: >-
    Minimal source-side self-description for the Cabinet estimate-observation
    probe. It names source meanings and authority, not Cabinet field names or a
    Cabinet-specific adapter.

source_baseline:
  case: examples/cabinet-backend
  accepted_model: PresuProEstimateObservation
  accepted_contract: refresh_estimate_snapshot
  evidence:
    - examples/cabinet-backend/60_model_closure_support.json
    - examples/cabinet-backend/60_contracts.json
  external_presupro_reconnaissance:
    observed_at: 2026-08-20
    source_workspace: projects/PresuPro_sandbox
    result:
      currency:
        derivable: true
        source_kind: application_contract_constant
        value: EUR
        contract: config.app.currency
        surfaced_by: calculate_estimate_totals
      monetary_tax_basis:
        derivable_as_single_estimate_observation_fact: false
        reason: >-
          The aggregate pricing formula is deterministic, but PresuPro does not
          expose one canonical item-total meaning or one monetary-basis carrier
          that can be applied to every estimate amount.

schemas:
  EmptyInput:
    identity: value
    fields: {}

  PresuProEstimateObservation:
    identity: value
    fields:
      estimate_id:
        type: str
        semantic: estimate.identity
        authority: estimate.source.authority
      project_id:
        type: str
        semantic: estimate.project_reference
        authority: estimate.source.authority
      updated_at:
        type: datetime
        semantic: estimate.source.updated_at
        authority: estimate.source.authority
      status:
        type: str
        semantic: estimate.status
        authority: estimate.source.authority
      locked:
        type: bool
        semantic: estimate.locked
        authority: estimate.source.authority
      canonical_content:
        type: str
        semantic: estimate.canonical_content
        authority: estimate.source.authority
      currency:
        type: str
        semantic: money.currency
        authority: estimate.source.authority
        source:
          kind: contract_constant
          contract: config.app.currency
          value: EUR
      observed_at:
        type: datetime
        semantic: observation.source_time
        authority: observation.reporter

capabilities:
  estimate.observe:
    input: EmptyInput
    output: PresuProEstimateObservation
    effects: []

experiment_boundaries:
  cabinet_field_names_in_source: false
  cabinet_adapter_in_source: false
  currency_invented_from_accepted_observation: false
  currency_exposed_from_verified_source_contract: true
  monetary_basis_invented_from_aggregate_formula: false
  canonical_item_total_invented: false
