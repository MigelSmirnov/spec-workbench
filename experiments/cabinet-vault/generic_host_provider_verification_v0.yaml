verification_version: cabinet_generic_host_provider_verification.v0
status: exploratory

purpose: >-
  Define the minimum executed evidence required before any candidate generic host
  provider may move from UNVERIFIED to PASS. These packets describe proof
  obligations only; they do not fabricate provider implementations or evidence.

status_semantics:
  PASS: all_required_probes_executed_and_passed_with_recorded_evidence
  FAIL: at_least_one_required_probe_executed_and_failed
  UNVERIFIED: required_evidence_not_obtained
  SKIP: probe_not_executed_and_never_equivalent_to_pass

provider_packets:
  authority_kernel:
    covers_requirements:
      - principal_authentication
      - bounded_capability_grants
      - exact_resource_scope_authorization
      - effect_policy_enforcement
      - disclosure_policy_enforcement
    runtime_dependencies: []
    source_contract:
      - experiments/cabinet-vault/cabinet_authority_contract_v0.yaml
    probes:
      - id: AUTH-PROBE-001
        proves: caller_supplied_authorization_decision_cannot_authorize_invocation
        status: UNVERIFIED
      - id: AUTH-PROBE-002
        proves: revoked_principal_or_credential_cannot_authorize_new_invocation
        status: UNVERIFIED
      - id: AUTH-PROBE-003
        proves: capability_without_exact_resource_scope_is_denied
        status: UNVERIFIED
      - id: AUTH-PROBE-004
        proves: synchronization_credential_is_rejected_at_local_agent_boundary
        status: UNVERIFIED
      - id: AUTH-PROBE-005
        proves: local_agent_credential_is_rejected_as_synchronization_authority
        status: UNVERIFIED
      - id: AUTH-PROBE-006
        proves: unauthorized_effect_or_disclosure_is_denied
        status: UNVERIFIED
      - id: AUTH-PROBE-007
        proves: protected_mutation_binds_actor_from_authenticated_principal
        status: UNVERIFIED
      - id: AUTH-PROBE-008
        proves: audit_evidence_contains_no_reusable_credential_material
        status: UNVERIFIED

  typed_schema_kernel:
    covers_requirements:
      - typed_input_output_validation
    runtime_dependencies:
      - pydantic
    implementation:
      path: tools/typed_schema_kernel.py
      blob_sha: 35e6c281ad9ce91c852036834a329f078d94726c
    probe_runner:
      path: tools/typed_schema_kernel_probe.py
      blob_sha: de5f9c3f0475eae0d37641add22c92efdccc4ebe
      successful_exit: 0
      blocking_exit: 2
    runtime_evidence:
      record: experiments/cabinet-vault/TYPED_SCHEMA_KERNEL_RUNTIME_EVIDENCE.md
      executed_on: 2026-08-21
      result: PASS
      exit_code: 0
    probes:
      - id: SCHEMA-PROBE-001
        proves: invalid_typed_input_is_rejected_before_effect
        status: PASS
        executed: true
        evidence:
          - fingerprint-bound typed schema probe runner returned overall status pass and exit 0 in the selected Termux runtime
          - runner semantics require SCHEMA-PROBE-001 PASS for overall status pass
      - id: SCHEMA-PROBE-002
        proves: undeclared_input_fields_are_rejected_for_closed_boundary_schemas
        status: PASS
        executed: true
        evidence:
          - fingerprint-bound typed schema probe runner returned overall status pass and exit 0 in the selected Termux runtime
          - runner semantics require SCHEMA-PROBE-002 PASS for overall status pass
      - id: SCHEMA-PROBE-003
        proves: invalid_provider_output_is_rejected_before_disclosure_or_settlement
        status: PASS
        executed: true
        evidence:
          - fingerprint-bound typed schema probe runner returned overall status pass and exit 0 in the selected Termux runtime
          - runner semantics require SCHEMA-PROBE-003 PASS for overall status pass

  postgres_record_kernel:
    covers_requirements:
      - transactional_record_store
      - resource_locking
      - audit_and_provenance
    runtime_dependencies:
      - psycopg
    implementation:
      path: tools/postgres_record_kernel.py
      blob_sha: 0128fba3796c13853b338bbf8e610a20cf5fc02d
    probe_runner:
      path: tools/postgres_record_kernel_probe.py
      blob_sha: 74c8edf7f7ca40061d1181a62372b444736bd371
      dsn_environment: SPEC_WORKBENCH_TEST_POSTGRES_DSN
      no_dsn_status: UNVERIFIED
      successful_exit: 0
      blocking_exit: 2
    runtime_evidence:
      record: experiments/cabinet-vault/POSTGRES_RECORD_KERNEL_RUNTIME_EVIDENCE.md
      executed_on: 2026-08-21
      result: PASS
      exit_code: 0
    probes:
      - id: RECORD-PROBE-001
        proves: psycopg_runtime_dependency_imports_in_selected_environment
        status: PASS
        executed: true
        evidence:
          - real Termux PostgreSQL runtime imported psycopg successfully
          - postgres_record_kernel_probe.py returned RECORD-PROBE-001 PASS and overall exit 0
      - id: RECORD-PROBE-002
        proves: declared_metadata_transition_commits_atomically_or_rolls_back
        status: PASS
        executed: true
        evidence:
          - real PostgreSQL transaction persisted committed state and rolled back the intentional failure
          - postgres_record_kernel_probe.py returned RECORD-PROBE-002 PASS and overall exit 0
      - id: RECORD-PROBE-003
        proves: exact_resource_lock_serializes_conflicting_mutations
        status: PASS
        executed: true
        evidence:
          - same-resource advisory lock blocked the contender while an unrelated resource remained independently lockable
          - contender acquired the same-resource lock after holder release; probe returned PASS and overall exit 0
      - id: RECORD-PROBE-004
        proves: failed_transaction_does_not_publish_partial_metadata_state
        status: PASS
        executed: true
        evidence:
          - intentional failed transaction exposed neither partial record state nor partial audit state
          - postgres_record_kernel_probe.py returned RECORD-PROBE-004 PASS and overall exit 0
      - id: RECORD-PROBE-005
        proves: audit_evidence_is_append_only_for_host_authority_and_effect_events
        status: PASS
        executed: true
        evidence:
          - inserted audit evidence persisted while direct UPDATE and DELETE were rejected by PostgreSQL
          - postgres_record_kernel_probe.py returned RECORD-PROBE-005 PASS and overall exit 0

  local_private_byte_vault:
    covers_requirements:
      - opaque_source_byte_vault
      - staged_byte_verification_and_atomic_publication
      - committed_effect_recovery
    runtime_dependencies: []
    implementation:
      path: tools/local_private_byte_vault.py
      blob_sha: 63a81188fc2ac84b50cecd8ebd8bcbf63f0ca29e
    probe_runner:
      path: tools/local_private_byte_vault_probe.py
      blob_sha: 0f8a14e06f6260d33d218e6f6de221c626cccc2e
      successful_exit: 0
      blocking_exit: 2
    runtime_evidence:
      record: experiments/cabinet-vault/LOCAL_PRIVATE_BYTE_VAULT_RUNTIME_EVIDENCE.md
      executed_on: 2026-08-21
      result: PASS
      exit_code: 0
    probes:
      - id: VAULT-PROBE-001
        proves: caller_never_selects_raw_storage_or_staging_path
        status: PASS
        executed: true
        evidence:
          - real Termux filesystem run returned opaque caller-visible references and rejected raw filesystem paths
          - local_private_byte_vault_probe.py returned VAULT-PROBE-001 PASS and overall exit 0
      - id: VAULT-PROBE-002
        proves: staged_bytes_are_reopened_and_hash_verified_before_committed_availability
        status: PASS
        executed: true
        evidence:
          - staged bytes were flushed, reopened, and verified by exact hash and size on the selected runtime
          - local_private_byte_vault_probe.py returned VAULT-PROBE-002 PASS and overall exit 0
      - id: VAULT-PROBE-003
        proves: conflicting_bytes_cannot_publish_under_one_content_addressed_final_reference
        status: PASS
        executed: true
        evidence:
          - conflicting existing final bytes were not overwritten under the content-addressed reference
          - local_private_byte_vault_probe.py returned VAULT-PROBE-003 PASS and overall exit 0
      - id: VAULT-PROBE-004
        proves: recoverable_staged_publication_finishes_after_provider_restart_and_converges_idempotently
        status: PASS
        executed: true
        evidence:
          - staged committed publication recovered after provider restart and repeated recovery converged on the same verified final blob
          - local_private_byte_vault_probe.py returned VAULT-PROBE-004 PASS and overall exit 0
      - id: VAULT-PROBE-005
        proves: unresolved_committed_publication_recovery_blocks_ready_state
        status: PASS
        executed: true
        evidence:
          - committed publication with neither final nor recoverable staging bytes raised a blocking recovery error
          - local_private_byte_vault_probe.py returned VAULT-PROBE-005 PASS and overall exit 0
      - id: VAULT-PROBE-006
        proves: symlink_device_and_non_regular_file_escape_fail_closed
        status: PASS
        executed: true
        evidence:
          - symlink and non-regular filesystem references failed closed before byte access on the selected runtime
          - local_private_byte_vault_probe.py returned VAULT-PROBE-006 PASS and overall exit 0
    boundary_note: >-
      Conflict between two byte values for one Cabinet source_id remains a
      capability/record-layer invariant under exact resource locking. The generic
      byte vault proves only that one content-addressed final reference cannot be
      overwritten by conflicting bytes.

  protected_configuration_kernel:
    covers_requirements:
      - protected_configuration
    runtime_dependencies: []
    implementation:
      path: tools/protected_configuration_kernel.py
      blob_sha: d2be861b72145e7bca987a451dd943b62d4b0f2e
    probe_runner:
      path: tools/protected_configuration_kernel_probe.py
      blob_sha: 6766115e39abba55413f4ba07066a1d4d1430d5d
      successful_exit: 0
      blocking_exit: 2
    runtime_evidence:
      record: experiments/cabinet-vault/PROTECTED_CONFIGURATION_KERNEL_RUNTIME_EVIDENCE.md
      executed_on: 2026-08-21
      result: PASS
      exit_code: 0
    probes:
      - id: CONFIG-PROBE-001
        proves: required_secret_configuration_missing_blocks_provider_ready_state
        status: PASS
        executed: true
        evidence:
          - fingerprint-bound protected configuration probe runner returned overall exit 0 in the selected Termux runtime
          - runner semantics require CONFIG-PROBE-001 PASS for overall status pass
      - id: CONFIG-PROBE-002
        proves: protected_configuration_values_are_not_exposed_to_box_callers_or_audit
        status: PASS
        executed: true
        evidence:
          - fingerprint-bound protected configuration probe runner returned overall exit 0 in the selected Termux runtime
          - runner semantics require CONFIG-PROBE-002 PASS for overall status pass
      - id: CONFIG-PROBE-003
        proves: configuration_reference_selects_declared_provider_input_without_becoming_business_data
        status: PASS
        executed: true
        evidence:
          - fingerprint-bound protected configuration probe runner returned overall exit 0 in the selected Termux runtime
          - runner semantics require CONFIG-PROBE-003 PASS for overall status pass

packet_rules:
  - every_candidate_profile_provider_has_exactly_one_packet
  - every_provider_satisfies_requirement_is_covered_by_its_packet
  - packet_runtime_dependencies_equal_profile_provider_runtime_dependencies
  - concrete_provider_and_probe_runner_are_fingerprint_bound_before_runtime_evidence_is_accepted
  - generic_provider_probe_does_not_absorb_product_source_identity_semantics
  - every_required_probe_must_have_recorded_executed_evidence_before_PASS
  - SKIP_or_missing_required_probe_normalizes_to_UNVERIFIED
  - provider_PASS_requires_all_required_probes_PASS
  - profile_provider_status_must_not_be_promoted_to_PASS_before_packet_PASS
  - packet_evidence_must_not_contain_reusable_credentials_or_protected_configuration_values
