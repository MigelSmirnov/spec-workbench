manifest_version: box_contract.v0
status: exploratory

cabinet:
  id: cabinet.local.plan_actual_amount_requirement
  product: Cabinet
  slice: plan_actual_planned_item_amount
  description: >-
    Probe-only Cabinet semantic requirement for the reopened plan/actual monetary
    decision. The earlier rule used EstimateItemSnapshot.total without proving one
    authoritative PresuPro item-level meaning. This target therefore requires an
    explicit planned amount and basis and does not accept aggregate estimate totals
    or ambiguous source totals as substitutes.

source_baseline:
  case: examples/cabinet-backend
  state1_refinement:
    - examples/cabinet-backend/01_models_plan_actual_monetary_gap.md
  reopened_rule:
    - examples/cabinet-backend/02_rules_plan_actual_semantic_gap.md
  evidence:
    - examples/cabinet-backend/60_model_closure_core.json

schemas:
  PlannedItemAmountRequirement:
    identity: value
    fields:
      planned_amount:
        type: Decimal
        semantic: estimate.item.planned_amount
        authority: estimate.source.authority
        mapping: exact
      currency:
        type: str
        semantic: money.currency
        authority: estimate.source.authority
        mapping: exact
      planned_amount_basis:
        type: str
        semantic: estimate.item.planned_amount_basis
        authority: estimate.source.authority
        mapping: exact

  PlannedItemAmountEvidence:
    identity: value
    fields:
      planned_amount: Decimal
      currency: str
      planned_amount_basis: str

capabilities:
  plan_actual.planned_item_amount.require:
    input: PlannedItemAmountRequirement
    output: PlannedItemAmountEvidence
    effects: []
    invariants:
      - aggregate_estimate_total_cannot_substitute_for_item_planned_amount
      - decimal_type_equality_does_not_prove_monetary_semantics
      - planned_amount_basis_must_be_explicitly_proven
      - implicit_net_gross_or_tax_basis_conversion_is_forbidden

experiment_boundaries:
  aggregate_grand_total_allowed_as_item_total: false
  field_name_inference_allowed: false
  type_only_mapping_allowed: false
  basis_inference_allowed: false
