manifest_version: box_contract.v0
status: exploratory

cabinet:
  id: cabinet.local.plan_actual.actual_line_amount_requirement
  product: Cabinet
  slice: plan_actual_actual_line_amount
  description: >-
    Provider-agnostic semantic requirement for the reopened actual monetary
    decision in plan/actual. It intentionally does not choose net or gross merely
    because the real Invoice Card V1 exposes both canonical meanings.

source_baseline:
  case: examples/cabinet-backend
  state1_refinement:
    - examples/cabinet-backend/01_models_plan_actual_monetary_gap.md
  reopened_rule:
    - examples/cabinet-backend/02_rules_plan_actual_semantic_gap.md
  issue_under_test: >-
    The earlier accepted rule used actual_amount = InvoiceLine.total, but Invoice
    Card V1 has no InvoiceLine.total field. V1 exposes distinct net_amount and
    gross_amount meanings, so Cabinet must explicitly choose the target semantic.

schemas:
  ActualLineAmountRequirement:
    identity: value
    fields:
      actual_amount:
        type: Decimal
        semantic: invoice.line.actual_amount
        authority: invoice.card.authority
        mapping: exact
      actual_amount_basis:
        type: str
        semantic: invoice.line.actual_amount_basis
        authority: invoice.card.authority
        mapping: exact
      currency:
        type: str
        semantic: money.currency
        authority: invoice.card.authority
        mapping: exact

  ActualLineAmountAcceptance:
    identity: value
    fields:
      accepted: bool

capabilities:
  plan_actual.actual_line_amount.require:
    input: ActualLineAmountRequirement
    output: ActualLineAmountAcceptance
    effects: []

experiment_boundaries:
  net_selected_by_default: false
  gross_selected_by_default: false
  field_name_total_inference_allowed: false
  type_only_amount_mapping_allowed: false
