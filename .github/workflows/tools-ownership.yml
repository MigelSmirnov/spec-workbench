name: tools-ownership

on:
  pull_request:

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generic tooling changes only on tools/* branches into main
        run: >-
          python tools/tools_ownership_check.py
          --base "origin/${{ github.base_ref }}"
          --branch "${{ github.head_ref }}"
