name: Stage 8.1 module review

on:
  push:
    branches:
      - agent/cabinet-backend-state-0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-archive-review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [${{ matrix.module }}, registry_context]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List assembled modules
        run: python tools/design_module_review.py examples/cabinet-backend --list

      - name: Run deterministic ${{ matrix.module }} review
        shell: bash
        run: |
          mkdir -p stage81-output
          set +e
          python tools/design_module_review.py examples/cabinet-backend --module ${{ matrix.module }} --review --json > stage81-output/${{ matrix.module }}_review.json
          code=$?
          set -e
          echo "$code" > stage81-output/${{ matrix.module }}_review.exit

      - name: Build ${{ matrix.module }} slice
        run: |
          python tools/design_module_review.py examples/cabinet-backend --module ${{ matrix.module }} --slice --json > stage81-output/${{ matrix.module }}_slice.json
          sha256sum stage81-output/${{ matrix.module }}_slice.json | tee stage81-output/${{ matrix.module }}_slice.sha256

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage81-durable-archive-review
          path: stage81-output/
          if-no-files-found: error

      - name: Enforce review result
        if: always()
        run: test "$(cat stage81-output/${{ matrix.module }}_review.exit)" = "0"
