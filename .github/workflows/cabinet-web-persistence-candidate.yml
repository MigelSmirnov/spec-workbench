name: Cabinet Web persistence candidate

on:
  push:
    branches:
      - agent/cabinet-web-card-persistence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workbench
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pyyaml pydantic Pillow pypdf "psycopg[binary]"

      - name: Materialize staged Cabinet Web persistence candidate
        shell: bash
        run: |
          set -euo pipefail
          project=examples/cabinet-web-backend
          stage=.stage/cabinet-web-persistence
          for name in \
            60_model_closure_domain.json \
            60_contract_plan.json \
            60_contracts.json \
            60_data_closure.json \
            70_persistence_closure.json
          do
            gzip -dc "$stage/$name.gz" > "$project/$name"
          done
          mkdir -p ci-artifacts/cabinet-web-persistence-candidate
          cp "$project"/60_model_closure_domain.json ci-artifacts/cabinet-web-persistence-candidate/
          cp "$project"/60_contract_plan.json ci-artifacts/cabinet-web-persistence-candidate/
          cp "$project"/60_contracts.json ci-artifacts/cabinet-web-persistence-candidate/
          cp "$project"/60_data_closure.json ci-artifacts/cabinet-web-persistence-candidate/
          cp "$project"/70_persistence_closure.json ci-artifacts/cabinet-web-persistence-candidate/

      - name: Validate candidate closures
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          import design_stage6_contracts
          import design_stage6_data
          from persistence_workbench import authoring

          project = Path("examples/cabinet-web-backend")
          data = design_stage6_data.lint(project)
          state6 = design_stage6_contracts.handoff(project)
          persistence = authoring.coverage(project)

          models = json.loads((project / "60_model_closure_domain.json").read_text())
          backend = json.loads((project / "70_persistence_closure.json").read_text())["backend_ir"]
          model_map = models["models"]
          table_map = {row["table"]: row for row in backend["tables"]}
          methods = [
              method
              for repo in backend["repositories"]
              for method in repo.get("methods", [])
          ]

          extra_findings = []
          for table, row in table_map.items():
              model = row["model"]
              if model not in model_map:
                  extra_findings.append(f"{table}: missing model {model}")
                  continue
              fields = model_map[model].get("fields", {})
              for column in row.get("columns", []):
                  if column["field"] not in fields:
                      extra_findings.append(
                          f"{table}.{column['column']}: missing model field {model}.{column['field']}"
                      )

          report = {
              "data": data,
              "state6_ready": state6.get("ready"),
              "state6_summary": state6.get("summary"),
              "persistence": persistence,
              "candidate_counts": {
                  "models": len(model_map),
                  "tables": len(backend["tables"]),
                  "repositories": len(backend["repositories"]),
                  "deterministic_methods": len(methods),
                  "contracts": len(json.loads((project / "60_contracts.json").read_text())["contracts"]),
              },
              "extra_findings": extra_findings,
          }
          Path("ci-artifacts/cabinet-web-persistence-candidate-validation.json").write_text(
              json.dumps(report, indent=2, sort_keys=True)
          )

          assert data["summary"]["errors"] == 0, data
          assert state6.get("ready") is True, state6
          assert persistence["status"] == "open", persistence
          assert persistence["summary"]["errors"] == 0, persistence
          assert persistence["summary"]["closed"] is False, persistence
          assert persistence["ready"] is False, persistence
          assert not extra_findings, extra_findings
          PY

      - name: Verify projector blocks only the open persistence handoff
        shell: bash
        run: |
          set +e
          python tools/design_spec_projection.py examples/cabinet-web-backend --plan --json \
            > ci-artifacts/cabinet-web-persistence-candidate-projection.json
          code=$?
          set -e
          test "$code" = "1"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("ci-artifacts/cabinet-web-persistence-candidate-projection.json").read_text())
          blocks = [item["code"] for item in report["findings"] if item["severity"] == "block"]
          assert blocks == ["persistence_handoff_not_ready"], blocks
          source = next(item for item in report["source_checks"] if item["source"] == "70_persistence_closure.json")
          assert source["status"] == "open"
          assert source["errors"] == 0
          PY

      - name: Run complete Workbench test suite against materialized candidate
        run: python -m pytest -q --junitxml=ci-artifacts/cabinet-web-persistence-candidate-pytest.xml

      - name: Check materialized diff integrity
        run: git diff --check

      - name: Upload candidate validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cabinet-web-persistence-candidate
          path: ci-artifacts/
          if-no-files-found: error
