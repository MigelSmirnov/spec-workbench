name: Cabinet Web persistence promotion

on:
  push:
    branches:
      - agent/cabinet-web-card-persistence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workbench
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pyyaml pydantic Pillow pypdf "psycopg[binary]"

      - name: Materialize validated candidate and propagation repairs
        run: |
          python tools/_cabinet_web_candidate_materialize.py \
            > cabinet-web-materialization.json
          python - <<'PY'
          import json
          from pathlib import Path
          project = Path("examples/cabinet-web-backend")
          closure = project / "70_persistence_closure.json"
          payload = json.loads(closure.read_text())
          assert payload["status"] == "open"
          payload["status"] = "closed"
          closure.write_text(json.dumps(payload, indent=2) + "\n")
          runtime = project / "70_runtime_closure.json"
          state = json.loads(runtime.read_text())
          lowering = state["lowering_status"]
          lowering["state3_module_boundaries"] = "closed"
          lowering["state6_repository_contracts"] = "closed"
          lowering["persistence_backend_ir"] = "closed"
          lowering["composition_root"] = "closed"
          lowering["stage8_1_recheck"] = "pending"
          runtime.write_text(json.dumps(state, indent=2) + "\n")
          PY

      - name: Validate closed authoring handoffs
        run: |
          mkdir -p ci-artifacts/final
          python tools/design_stage6_data.py examples/cabinet-web-backend --lint --json \
            > ci-artifacts/final/data.json
          python tools/design_stage6_contracts.py examples/cabinet-web-backend --handoff --json \
            > ci-artifacts/final/contracts.json
          python tools/design_persistence_authoring.py examples/cabinet-web-backend --handoff --json \
            > ci-artifacts/final/persistence-authoring.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("ci-artifacts/final/persistence-authoring.json").read_text())
          assert p["ready"] is True, p
          assert p["summary"]["errors"] == 0, p
          assert p["summary"]["closed"] is True, p
          PY

      - name: Project canonical specification
        run: |
          python tools/design_spec_projection.py examples/cabinet-web-backend --plan --json \
            > ci-artifacts/final/projection-plan.json
          python tools/design_spec_projection.py examples/cabinet-web-backend --apply --json \
            > ci-artifacts/final/projection-apply.json
          python tools/design_spec_projection.py examples/cabinet-web-backend --verify --json \
            > ci-artifacts/final/projection-verify.json

      - name: Run complete Workbench suite and assembly
        run: |
          python -m pytest -q --junitxml=ci-artifacts/final/pytest.xml
          python tools/design_assembly.py examples/cabinet-web-backend --json \
            > ci-artifacts/final/assembly.json
          python tools/design_assembly.py examples/cabinet-web-backend --check notes --json \
            > ci-artifacts/final/notes.json
          python tools/design_assembly.py examples/cabinet-web-backend --check persistence --json \
            > ci-artifacts/final/persistence.json
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("ci-artifacts/final/assembly.json").read_text())
          assert a["ready"] is True, a
          assert a["summary"]["errors"] == 0, a
          assert a["summary"]["ready_checks"] == a["summary"]["checks"], a
          PY

      - name: Capture Stage 8.1 review packets
        shell: bash
        run: |
          mkdir -p ci-artifacts/final/module-review
          python tools/design_module_review.py examples/cabinet-web-backend --list --json \
            > ci-artifacts/final/module-review/list.json
          for module in \
            access_control card_workspace invoice_workspace project_workspace \
            cabinet_persistence source_custody invoice_exchange registry_replica runtime_control bootstrap
          do
            set +e
            python tools/design_module_review.py examples/cabinet-web-backend \
              --module "$module" --slice --json \
              > "ci-artifacts/final/module-review/$module.json"
            echo "$?" > "ci-artifacts/final/module-review/$module.exit"
            set -e
          done

      - name: Capture canonical promotion files
        run: |
          project=examples/cabinet-web-backend
          mkdir -p ci-artifacts/promotion-files/tools/spec_projection_workbench
          cp "$project"/60_model_closure_domain.json ci-artifacts/promotion-files/
          cp "$project"/60_contract_plan.json ci-artifacts/promotion-files/
          cp "$project"/60_contracts.json ci-artifacts/promotion-files/
          cp "$project"/60_data_closure.json ci-artifacts/promotion-files/
          cp "$project"/70_persistence_closure.json ci-artifacts/promotion-files/
          cp "$project"/70_runtime_closure.json ci-artifacts/promotion-files/
          cp "$project"/80_notes.md ci-artifacts/promotion-files/
          cp "$project"/global_spec.json ci-artifacts/promotion-files/
          cp tools/spec_projection_workbench/service.py \
            ci-artifacts/promotion-files/tools/spec_projection_workbench/service.py
          git diff --check

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cabinet-web-persistence-promotion
          path: ci-artifacts/
          if-no-files-found: error
