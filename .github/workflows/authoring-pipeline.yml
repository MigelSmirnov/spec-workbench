name: Authoring pipeline

on:
  pull_request:
    paths:
      - "tools/design_*.py"
      - "tools/authoring*.py"
      - "tools/workbench.py"
      - "tools/project_navigation.py"
      - "skills/spec-authoring/**"
      - "PROJECT_INDEX.json"
      - "tests/test_authoring_pipeline_core.py"
      - "tests/test_design_*.py"
      - "tests/test_project_navigation.py"
      - "tests/test_project_index_health.py"
      - "tests/test_workbench.py"
      - ".github/workflows/authoring-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "tools/design_*.py"
      - "tools/authoring*.py"
      - "skills/spec-authoring/**"
      - "PROJECT_INDEX.json"
      - ".github/workflows/authoring-pipeline.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - name: Run authoring and navigation tests
        run: >-
          python -m pytest -q
          tests/test_authoring_pipeline_core.py
          tests/test_design_index.py
          tests/test_design_lint.py
          tests/test_design_editor.py
          tests/test_design_stage3.py
          tests/test_design_trace.py
          tests/test_design_stage4.py
          tests/test_design_stage5.py
          tests/test_project_navigation.py
          tests/test_project_index_health.py
          tests/test_workbench.py
      - name: Smoke indexed projects through common pipeline
        shell: bash
        run: |
          set -euo pipefail
          for project in room-planner cabinet-backend cabinet-web-backend client-portal; do
            set +e
            python tools/authoring.py next "$project" --json > "/tmp/${project}.json"
            code=$?
            set -e
            cat "/tmp/${project}.json"
            if [ "$code" -gt 1 ]; then
              echo "authoring pipeline crashed for ${project} with exit ${code}" >&2
              exit "$code"
            fi
          done
