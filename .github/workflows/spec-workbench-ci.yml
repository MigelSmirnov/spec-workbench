name: Spec Workbench CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    name: Tests and assembly
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workbench
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node (TypeScript verification for frontend manifests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript
        run: npm install -g typescript@5

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pyyaml pydantic Pillow pypdf "psycopg[binary]"

      # No case is checked here: the canonical Cabinet cases are off active
      # development (2026-09-27) and were removed from CI on 2026-11-03.
      # The active line (cabinet-kernel) gets its projection, assembly and
      # admission checks here once it assembles.
      - name: Prepare evidence directory
        run: |
          mkdir -p ../ci-artifacts
          git rev-parse HEAD > ../ci-artifacts/head.txt

      - name: Run complete Workbench test suite
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.head_ref, 'tools/') ||
          startsWith(github.ref_name, 'tools/')
        run: python -m pytest -q --junitxml=../ci-artifacts/pytest.xml

      - name: Check patch integrity
        run: git diff --check

      - name: Stage Workbench evidence for upload
        if: always()
        run: |
          rm -rf ci-artifacts
          cp -R ../ci-artifacts ci-artifacts

      - name: Upload Workbench evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spec-workbench-ci-evidence
          path: ci-artifacts/
          if-no-files-found: error
