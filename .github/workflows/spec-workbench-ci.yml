name: Spec Workbench CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-workbench-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbench:
    name: Tests and assembly
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workbench
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pyyaml pydantic Pillow pypdf "psycopg[binary]"

      - name: Run complete Workbench test suite
        run: |
          mkdir -p ci-artifacts
          python -m pytest -q --junitxml=ci-artifacts/pytest.xml

      - name: Verify mature Cabinet assembly
        run: >-
          python tools/design_assembly.py examples/cabinet-backend --json
          > ci-artifacts/cabinet-backend-assembly.json

      - name: Verify in-progress Cabinet Web assembly fails closed
        shell: bash
        run: |
          set +e
          python tools/design_assembly.py examples/cabinet-web-backend --json \
            > ci-artifacts/cabinet-web-backend-assembly.json
          code=$?
          set -e
          test "$code" = "1"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("ci-artifacts/cabinet-web-backend-assembly.json").read_text()
          )
          assert report["ready"] is False
          assert report["summary"]["errors"] > 0
          PY

      - name: Check patch integrity
        run: git diff --check

      - name: Upload Workbench evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-workbench-ci-evidence
          path: ci-artifacts/
          if-no-files-found: error

  factory-admission:
    name: Cross-repository Factory admission
    needs: workbench
    runs-on: ubuntu-latest
    env:
      FACTORY_REPO_TOKEN: ${{ secrets.FACTORY_REPO_TOKEN }}
    steps:
      - name: Detect private Factory access
        id: factory-access
        shell: bash
        run: |
          if test -n "$FACTORY_REPO_TOKEN"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FACTORY_REPO_TOKEN is not configured; cross-repository admission is skipped."
            echo "### Factory admission skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the read-only repository secret \`FACTORY_REPO_TOKEN\` to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out Workbench
        if: steps.factory-access.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          path: spec-workbench

      - name: Check out private Factory
        if: steps.factory-access.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: MigelSmirnov/panelforge-sandbox
          ref: agent/cabinet-web-route-b-official
          token: ${{ secrets.FACTORY_REPO_TOKEN }}
          path: code_factory

      - name: Set up Python
        if: steps.factory-access.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install admission dependencies
        if: steps.factory-access.outputs.available == 'true'
        run: >-
          python -m pip install
          pytest pyyaml pydantic Pillow pypdf "psycopg[binary]"

      - name: Admit mature Cabinet backend
        if: steps.factory-access.outputs.available == 'true'
        working-directory: spec-workbench
        run: |
          mkdir -p ci-artifacts
          python tools/design_factory_admission.py examples/cabinet-backend \
            --project cabinet_backend \
            --factory-root ../code_factory \
            --update-existing \
            --json > ci-artifacts/cabinet-backend-admission.json

      - name: Verify Cabinet Web revision remains fail-closed
        if: steps.factory-access.outputs.available == 'true'
        working-directory: spec-workbench
        shell: bash
        run: |
          set +e
          python tools/design_factory_admission.py examples/cabinet-web-backend \
            --project Cabinet_web \
            --factory-root ../code_factory \
            --update-existing \
            --json > ci-artifacts/cabinet-web-backend-admission.json
          code=$?
          set -e
          test "$code" = "1"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("ci-artifacts/cabinet-web-backend-admission.json").read_text()
          )
          assert report["status"] == "BLOCKED"
          checks = {item["id"]: item for item in report["checks"]}
          assert checks["FA014"]["status"] == "PASS"
          assert {checks[key]["status"] for key in ("FA002", "FA003", "FA013")} == {"BLOCK"}
          PY

      - name: Upload Factory admission evidence
        if: always() && steps.factory-access.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-admission-evidence
          path: spec-workbench/ci-artifacts/
          if-no-files-found: error
