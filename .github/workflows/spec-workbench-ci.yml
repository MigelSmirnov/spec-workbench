name: Spec Workbench CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    name: Tests and assembly
    runs-on: ubuntu-latest
    steps:
      - name: Check out Workbench
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node (TypeScript verification for frontend manifests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript
        run: npm install -g typescript@5

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pyyaml pydantic Pillow pypdf "psycopg[binary]"

      # The Cabinet cases are authored on their canonical refs (PROJECT_INDEX.json),
      # not on the branch under test. Verify the tools of this checkout against the
      # canonical case, never against a stale snapshot that happens to sit here.
      - name: Check out canonical cases
        env:
          CANONICAL_DIR: canonical-cases
        run: |
          mkdir -p ../ci-artifacts "$CANONICAL_DIR"
          python - <<'PY' > ../ci-artifacts/canonical-refs.txt
          import json
          index = json.load(open("PROJECT_INDEX.json"))
          for project in index["projects"]:
              if project["id"] in ("cabinet-backend", "cabinet-web-backend"):
                  print(project["id"], project["canonical_ref"], project["path"])
          PY
          while read -r case ref path; do
            git fetch --quiet --depth=1 origin "$ref"
            git archive --format=tar FETCH_HEAD "$path" | tar -x -C "$CANONICAL_DIR"
            echo "$case $ref $(git rev-parse FETCH_HEAD) $path" >> ../ci-artifacts/canonical-refs.resolved.txt
          done < ../ci-artifacts/canonical-refs.txt
          cat ../ci-artifacts/canonical-refs.resolved.txt

      - name: Capture Cabinet Web closure sources
        run: |
          tar -czf ../ci-artifacts/cabinet-web-closure-sources.tar.gz \
            -C canonical-cases examples/cabinet-web-backend

      - name: Run complete Workbench test suite
        run: python -m pytest -q --junitxml=../ci-artifacts/pytest.xml

      - name: Verify Cabinet Web canonical projection
        run: |
          python tools/design_spec_projection.py canonical-cases/examples/cabinet-web-backend --verify --json \
            > ../ci-artifacts/cabinet-web-backend-projection.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("../ci-artifacts/cabinet-web-backend-projection.json").read_text())
          assert report["ready"] is True
          assert report["in_sync"] is True
          PY

      # This job has no Factory checkout: the witness and persistence-codec
      # checks reach the Factory and are verified by the admission job below.
      - name: Verify canonical Cabinet assemblies (Factory-independent checks)
        run: |
          for case in cabinet-backend cabinet-web-backend; do
            python tools/design_assembly.py "canonical-cases/examples/$case" --json \
              > "../ci-artifacts/$case-assembly.json" || true
          done
          python - <<'PY'
          import json
          from pathlib import Path
          deferred = {"witness", "persistence"}  # need the Factory checkout; the admission job verifies them
          for case in ("cabinet-backend", "cabinet-web-backend"):
              report = json.loads(Path(f"../ci-artifacts/{case}-assembly.json").read_text())
              blocked = [c for c in report["checks"] if not c["ready"] and c["name"] not in deferred]
              for check in blocked:
                  print(case, check["name"], check["errors"], json.dumps(check["summary"], ensure_ascii=False)[:300])
                  for finding in check.get("findings", [])[:5]:
                      print("   ", json.dumps(finding, ensure_ascii=False)[:300])
              assert not blocked, (case, [c["name"] for c in blocked])
              waiting = [c["name"] for c in report["checks"] if not c["ready"]]
              print(case, "ready except Factory-dependent:", waiting or "none")
          PY

      - name: Verify Cabinet Web Stage 8.1 ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path("canonical-cases/examples/cabinet-web-backend/81_module_review_status.json").read_text())
          assert ledger["status"] == "closed"
          summary = ledger["summary"]
          modules = ledger["modules"]
          # the ledger is closed when every assembled module is reviewed and passed;
          # the module count is the case's, never a number fixed in this workflow
          assert summary["module_count"] == len(modules) > 0
          assert summary["reviewed"] == summary["passed"] == summary["module_count"]
          assert summary["ambiguities"] == summary["pending"] == summary["stale"] == 0
          assert all(item["review_status"] == "PASS" for item in modules)
          PY

      - name: Check patch integrity
        run: git diff --check

      - name: Stage Workbench evidence for upload
        if: always()
        run: |
          rm -rf ci-artifacts
          cp -R ../ci-artifacts ci-artifacts

      - name: Upload Workbench evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spec-workbench-ci-evidence
          path: ci-artifacts/
          if-no-files-found: error

  factory-admission:
    name: Cross-repository Factory admission
    needs: workbench
    runs-on: ubuntu-latest
    env:
      FACTORY_REPO_DEPLOY_KEY: ${{ secrets.FACTORY_REPO_DEPLOY_KEY }}
    steps:
      - name: Detect private Factory access
        id: factory-access
        shell: bash
        run: |
          if test -n "$FACTORY_REPO_DEPLOY_KEY"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FACTORY_REPO_DEPLOY_KEY is not configured; cross-repository admission is skipped."
          fi

      - name: Check out Workbench
        if: steps.factory-access.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          path: spec-workbench
          persist-credentials: false

      - name: Check out private Factory
        if: steps.factory-access.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: MigelSmirnov/panelforge-sandbox
          ref: agent/cabinet-web-route-b-official
          ssh-key: ${{ secrets.FACTORY_REPO_DEPLOY_KEY }}
          persist-credentials: false
          path: code_factory

      - name: Set up Python
        if: steps.factory-access.outputs.available == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install admission dependencies
        if: steps.factory-access.outputs.available == 'true'
        run: >-
          python -m pip install
          pytest pyyaml pydantic Pillow pypdf "psycopg[binary]"

      # Admission needs the case's own git metadata (FA001), so the canonical
      # ref is materialised as a full worktree next to this checkout.
      - name: Check out canonical case worktree
        if: steps.factory-access.outputs.available == 'true'
        working-directory: spec-workbench
        run: |
          ref=$(python - <<'PY'
          import json
          index = json.load(open("PROJECT_INDEX.json"))
          print(next(p["canonical_ref"] for p in index["projects"] if p["id"] == "cabinet-web-backend"))
          PY
          )
          git fetch --quiet origin "$ref"
          git worktree add --detach ../canonical-wb FETCH_HEAD
          echo "canonical worktree: $ref $(git -C ../canonical-wb rev-parse HEAD)"
      - name: Admit canonical Cabinet cases against the Factory
        if: steps.factory-access.outputs.available == 'true'
        working-directory: spec-workbench
        run: |
          mkdir -p ../ci-artifacts
          for pair in cabinet-backend:cabinet_backend cabinet-web-backend:Cabinet_web; do
            case="${pair%%:*}"; project="${pair##*:}"
            python tools/design_factory_admission.py "../canonical-wb/examples/$case" \
              --project "$project" \
              --factory-root ../code_factory \
              --update-existing \
              --json > "../ci-artifacts/$case-admission.json" || true
          done
          python - <<'PY'
          import json
          from pathlib import Path
          failed = []
          for case in ("cabinet-backend", "cabinet-web-backend"):
              report = json.loads(Path(f"../ci-artifacts/{case}-admission.json").read_text())
              print(case, report["status"], json.dumps(report["summary"]))
              for check in report["checks"]:
                  if check["status"] not in ("PASS", "NOT_APPLICABLE"):
                      print("   ", check["id"], check["status"], check["summary"][:200])
              if not (report["ready"] is True and report["status"] == "READY_TO_EXPORT"
                      and report["summary"]["blocks"] == 0 and report["summary"]["warnings"] == 0):
                  failed.append(case)
          assert not failed, failed
          PY

      - name: Upload Factory admission evidence
        if: always() && steps.factory-access.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: factory-admission-evidence
          path: ci-artifacts/
          if-no-files-found: error
