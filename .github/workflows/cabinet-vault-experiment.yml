name: Cabinet vault experiment

on:
  push:
    branches:
      - agent/cabinet-vault-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml pydantic Pillow pypdf "psycopg[binary]"

      - name: Run Cabinet vault experiment tests
        run: |
          python -m pytest -q \
            experiments/cabinet-vault/tests/test_box_*.py \
            experiments/cabinet-vault/tests/test_cabinet_*.py \
            experiments/cabinet-vault/tests/test_estimate_derivability.py \
            experiments/cabinet-vault/tests/test_plan_actual_*.py \
            experiments/cabinet-vault/tests/test_generic_host_lowering_contract.py \
            experiments/cabinet-vault/tests/test_host_lowering_plan.py \
            experiments/cabinet-vault/tests/test_host_provider_verification.py \
            experiments/cabinet-vault/tests/test_postgres_record_kernel.py \
            experiments/cabinet-vault/tests/test_local_private_byte_vault.py \
            experiments/cabinet-vault/tests/test_typed_schema_kernel.py \
            experiments/cabinet-vault/tests/test_protected_configuration_kernel.py \
            experiments/cabinet-vault/tests/test_authority_kernel.py \
            experiments/cabinet-vault/tests/test_capability_execution_readiness.py \
            experiments/cabinet-vault/tests/test_bounded_content_validation_kernel.py \
            experiments/cabinet-vault/tests/test_invoice_source_attach_runtime.py

      - name: Enforce declared box language
        run: python experiments/cabinet-vault/tools/box_language_audit.py

      - name: Prove failed generated backend remains unverified
        shell: bash
        run: |
          set +e
          python experiments/cabinet-vault/tools/cabinet_boundary_audit.py \
            experiments/cabinet-vault/generated_backend_failure_evidence_v0.yaml \
            --json > cabinet-boundary-audit.json
          code=$?
          set -e
          test "$code" = "2"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("cabinet-boundary-audit.json").read_text())
          assert report["status"] == "classified"
          assert report["verification_gate"] == "block"
          skipped = next(
              item for item in report["findings"]
              if item["finding_id"] == "semantic-runtime-verification-skipped"
          )
          assert skipped["declared_verification_status"] == "SKIP"
          assert skipped["verification_status"] == "UNVERIFIED"
          PY

      - name: Compile verified candidate generic host plan
        run: |
          python experiments/cabinet-vault/tools/host_lowering_plan.py \
            experiments/cabinet-vault/cabinet_backend_box_v0.yaml \
            experiments/cabinet-vault/generic_host_profile_candidate_v0.yaml \
            --json > generic-host-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("generic-host-plan.json").read_text())
          assert plan["status"] == "compiled"
          assert plan["verification_gate"] == "pass"
          assert plan["gaps"] == []
          assert set(plan["runtime_dependencies"]) == {"pydantic", "psycopg"}
          assert {item["verification_status"] for item in plan["provider_verification"]} == {"PASS"}
          assert len(plan["provider_verification"]) == 5
          PY

      - name: Compile source attach capability readiness
        run: |
          python experiments/cabinet-vault/tools/capability_execution_readiness.py \
            experiments/cabinet-vault/cabinet_backend_box_v0.yaml \
            experiments/cabinet-vault/generic_host_profile_candidate_v0.yaml \
            experiments/cabinet-vault/invoice_source_attach_execution_contract_v0.yaml \
            --json > invoice-source-attach-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("invoice-source-attach-readiness.json").read_text())
          assert report["status"] == "ready"
          assert report["host_verification_gate"] == "pass"
          assert report["capability_readiness_gate"] == "pass"
          assert report["blocking_gaps"] == []
          PY

      - name: Prove source attach runtime stays unverified without protected runtime config
        shell: bash
        run: |
          set +e
          env -u SPEC_WORKBENCH_TEST_POSTGRES_DSN -u SPEC_WORKBENCH_ATTACH_VAULT_ROOT \
            python experiments/cabinet-vault/tools/invoice_source_attach_runtime_probe.py > invoice-source-attach-runtime-probe.json
          code=$?
          set -e
          test "$code" = "2"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("invoice-source-attach-runtime-probe.json").read_text())
          assert report["status"] == "block"
          assert len(report["results"]) == 7
          assert {item["status"] for item in report["results"]} == {"UNVERIFIED"}
          PY

      - name: Prove PostgreSQL runtime probe still fails closed without DSN
        shell: bash
        run: |
          set +e
          env -u SPEC_WORKBENCH_TEST_POSTGRES_DSN \
            python experiments/cabinet-vault/tools/postgres_record_kernel_probe.py > postgres-record-kernel-probe.json
          code=$?
          set -e
          test "$code" = "2"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("postgres-record-kernel-probe.json").read_text())
          assert report["status"] == "block"
          by_id = {item["probe_id"]: item for item in report["results"]}
          assert by_id["RECORD-PROBE-001"]["status"] == "PASS"
          assert {
              by_id[probe_id]["status"]
              for probe_id in (
                  "RECORD-PROBE-002",
                  "RECORD-PROBE-003",
                  "RECORD-PROBE-004",
                  "RECORD-PROBE-005",
              )
          } == {"UNVERIFIED"}
          PY

      - name: Execute byte vault provider probe
        run: |
          python experiments/cabinet-vault/tools/local_private_byte_vault_probe.py > local-private-byte-vault-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("local-private-byte-vault-probe.json").read_text())
          assert report["status"] == "pass"
          assert {item["status"] for item in report["results"]} == {"PASS"}
          PY

      - name: Execute typed schema provider probe
        run: |
          python experiments/cabinet-vault/tools/typed_schema_kernel_probe.py > typed-schema-kernel-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("typed-schema-kernel-probe.json").read_text())
          assert report["status"] == "pass"
          assert {item["status"] for item in report["results"]} == {"PASS"}
          PY

      - name: Execute protected configuration provider probe
        run: |
          python experiments/cabinet-vault/tools/protected_configuration_kernel_probe.py > protected-configuration-kernel-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("protected-configuration-kernel-probe.json").read_text())
          assert report["status"] == "pass"
          assert {item["status"] for item in report["results"]} == {"PASS"}
          PY

      - name: Execute authority provider probe
        run: |
          python experiments/cabinet-vault/tools/authority_kernel_probe.py > authority-kernel-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("authority-kernel-probe.json").read_text())
          assert report["status"] == "pass"
          assert {item["status"] for item in report["results"]} == {"PASS"}
          assert len(report["results"]) == 8
          PY

      - name: Execute bounded content validation candidate probe
        run: |
          python experiments/cabinet-vault/tools/bounded_content_validation_kernel_probe.py > bounded-content-validation-kernel-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("bounded-content-validation-kernel-probe.json").read_text())
          assert report["status"] == "pass"
          assert {item["status"] for item in report["results"]} == {"PASS"}
          assert len(report["results"]) == 5
          PY

      - name: Check patch integrity
        run: git diff --check HEAD^ HEAD

      - name: Upload experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-vault-experiment-evidence
          path: |
            cabinet-boundary-audit.json
            generic-host-plan.json
            invoice-source-attach-readiness.json
            invoice-source-attach-runtime-probe.json
            postgres-record-kernel-probe.json
            local-private-byte-vault-probe.json
            typed-schema-kernel-probe.json
            protected-configuration-kernel-probe.json
            authority-kernel-probe.json
            bounded-content-validation-kernel-probe.json
          if-no-files-found: error
