name: Cabinet vault experiment

on:
  push:
    branches:
      - agent/cabinet-vault-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml pydantic "psycopg[binary]"

      - name: Run Cabinet vault experiment tests
        run: |
          python -m pytest -q \
            tests/test_box_*.py \
            tests/test_cabinet_*.py \
            tests/test_estimate_derivability.py \
            tests/test_plan_actual_*.py \
            tests/test_generic_host_lowering_contract.py \
            tests/test_host_lowering_plan.py \
            tests/test_host_provider_verification.py \
            tests/test_postgres_record_kernel.py \
            tests/test_local_private_byte_vault.py \
            tests/test_typed_schema_kernel.py \
            tests/test_protected_configuration_kernel.py

      - name: Enforce declared box language
        run: python tools/box_language_audit.py

      - name: Prove failed generated backend remains unverified
        shell: bash
        run: |
          set +e
          python tools/cabinet_boundary_audit.py \
            experiments/cabinet-vault/generated_backend_failure_evidence_v0.yaml \
            --json > cabinet-boundary-audit.json
          code=$?
          set -e
          test "$code" = "2"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("cabinet-boundary-audit.json").read_text())
          assert report["status"] == "classified"
          assert report["verification_gate"] == "block"
          skipped = next(
              item for item in report["findings"]
              if item["finding_id"] == "semantic-runtime-verification-skipped"
          )
          assert skipped["declared_verification_status"] == "SKIP"
          assert skipped["verification_status"] == "UNVERIFIED"
          PY

      - name: Compile candidate generic host plan fail closed
        shell: bash
        run: |
          set +e
          python tools/host_lowering_plan.py \
            experiments/cabinet-vault/cabinet_backend_box_v0.yaml \
            experiments/cabinet-vault/generic_host_profile_candidate_v0.yaml \
            --json > generic-host-plan.json
          code=$?
          set -e
          test "$code" = "2"
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("generic-host-plan.json").read_text())
          assert plan["status"] == "compiled"
          assert plan["verification_gate"] == "block"
          assert plan["gaps"] == []
          assert set(plan["runtime_dependencies"]) == {"pydantic", "psycopg"}
          verification = {
              item["provider_id"]: item["verification_status"]
              for item in plan["provider_verification"]
          }
          assert {
              provider_id
              for provider_id, status in verification.items()
              if status == "PASS"
          } == {
              "postgres_record_kernel",
              "local_private_byte_vault",
          }
          assert {
              provider_id
              for provider_id, status in verification.items()
              if status == "UNVERIFIED"
          } == {
              "authority_kernel",
              "typed_schema_kernel",
              "protected_configuration_kernel",
          }
          PY

      - name: Prove PostgreSQL provider cannot pass without runtime DSN
        shell: bash
        run: |
          set +e
          env -u SPEC_WORKBENCH_TEST_POSTGRES_DSN \
            python tools/postgres_record_kernel_probe.py > postgres-record-kernel-probe.json
          code=$?
          set -e
          test "$code" = "2"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("postgres-record-kernel-probe.json").read_text())
          assert report["status"] == "block"
          by_id = {item["probe_id"]: item for item in report["results"]}
          assert by_id["RECORD-PROBE-001"]["status"] == "PASS"
          assert {
              by_id[probe_id]["status"]
              for probe_id in (
                  "RECORD-PROBE-002",
                  "RECORD-PROBE-003",
                  "RECORD-PROBE-004",
                  "RECORD-PROBE-005",
              )
          } == {"UNVERIFIED"}
          PY

      - name: Execute byte vault provider probe
        run: |
          python tools/local_private_byte_vault_probe.py > local-private-byte-vault-probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("local-private-byte-vault-probe.json").read_text())
          assert report["status"] == "pass"
          assert {item["status"] for item in report["results"]} == {"PASS"}
          PY

      - name: Execute typed schema provider probe
        run: |
          python tools/typed_schema_kernel_probe.py > typed-schema-kernel-probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("typed-schema-kernel-probe.json").read_text())
          assert report["status"] == "pass"
          assert {item["status"] for item in report["results"]} == {"PASS"}
          PY

      - name: Execute protected configuration provider probe
        run: |
          python tools/protected_configuration_kernel_probe.py > protected-configuration-kernel-probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("protected-configuration-kernel-probe.json").read_text())
          assert report["status"] == "pass"
          assert {item["status"] for item in report["results"]} == {"PASS"}
          PY

      - name: Check patch integrity
        run: git diff --check HEAD^ HEAD

      - name: Upload experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-vault-experiment-evidence
          path: |
            cabinet-boundary-audit.json
            generic-host-plan.json
            postgres-record-kernel-probe.json
            local-private-byte-vault-probe.json
            typed-schema-kernel-probe.json
            protected-configuration-kernel-probe.json
          if-no-files-found: error
